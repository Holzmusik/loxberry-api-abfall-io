[INTRO]
SUMMARY="First-time setup"
SUMMARY_HINT="Open for step-by-step instructions"
TITLE="How to use this plugin (quick guide)"
LEAD="This plugin fetches your collection dates straight from your waste operator's public calendar (api.abfall.io, hausmuell.info, Müllabfuhr Deutschland, AWIDO or Abfuhr-Wecker) once data source and address are set."
STEP1="Open the “Location” tab: choose the data source (which portal does your operator publish its calendar on?), then pick operator/region and your address and save. Interval, MQTT, etc. stay under “Settings”."
STEP2="Open “Status & data” and press “Fetch now”. The next pickups then appear in the table."
STEP3="Open “Settings” when you are ready (optional): how often to fetch, which bin types to show, and whether to send dates into your Loxone Miniserver (virtual input) and/or out via MQTT to other systems. Further down on the same tab, a short explanation compares Loxone, MQTT, and JSON."
STEP4="Something wrong? Open “Log” — the last lines help you debug (no guaranteed support; see legal notice below)."
FOOTNOTE="Data sources: api.abfall.io, hausmuell.info (ATURIS), portal.muellabfuhr-deutschland.de, AWIDO (cubefour) and Abfuhr-Wecker (offizium). There is no silent default city — you must choose your operator and address on the Location tab."
LEGAL_SUMMARY="Legal: not official, no support guarantee, fair use (expand)"
LEGAL_BLOCK_HTML="<p>This plugin is an <strong>independent community project</strong> for LoxBerry. It is <strong>not</strong> affiliated with the operators of the waste-calendar services it uses (api.abfall.io / AbfallPlus, hausmuell.info / ATURIS, portal.muellabfuhr-deutschland.de, AWIDO / cubefour, Abfuhr-Wecker / offizium) or with the waste operators themselves. They (and the authors of this repository) <strong>do not</strong> provide any obligation to help you. <strong>No end-user support is promised.</strong></p><p>Access uses <strong>publicly reachable</strong> interfaces and calendar exports, the same ones the operators' websites load in a browser. Scheduled fetches are limited to a <strong>minimum of 6 hours</strong> between runs to keep load reasonable — do not try to work around that.</p><p>Interfaces and content may <strong>change or stop at any time</strong>; your operator's own information always prevails. Use is <strong>at your own risk</strong>. Full text: <code>DISCLAIMER.md</code> in the repository.</p>"

